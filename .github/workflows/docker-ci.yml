name: Build, Test & Push images

on:
  push:
    tags:
      - "*.*.*"               # e.g., 1.0.0, 2.1.3 (builds all variants)
      - "*.*.*-*"             # e.g., 1.0.0-dev, 1.0.1-rc1 (builds all variants)
      - "alpine-*.*.*"        # e.g., alpine-1.0.0 (builds only alpine)
      - "alpine-*.*.*-*"      # e.g., alpine-1.0.0-rc1 (builds only alpine)
      - "debian-*.*.*"        # e.g., debian-1.0.0 (builds only debian)
      - "debian-*.*.*-*"      # e.g., debian-1.0.0-rc1 (builds only debian)
      - "ha-alpine-*.*.*"     # e.g., ha-alpine-1.0.0 (builds only ha-alpine)
      - "ha-alpine-*.*.*-*"   # e.g., ha-alpine-1.0.0-rc1 (builds only ha-alpine)
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  PLATFORMS: ${{ vars.PLATFORMS }}
  TEST_PLATFORM: ${{ vars.TEST_PLATFORM }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: debian
            dockerfile: ./debian.dockerfile
            tag: debian
            latest: true
          - variant: alpine
            dockerfile: ./alpine.dockerfile
            tag: alpine
            latest: false
          - variant: ha-alpine
            dockerfile: ./ha-alpine.dockerfile
            tag: ha-alpine
            latest: false
            build_args: "BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.23"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine tag name
        id: vars
        run: echo "VERSION_TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Check if should build this variant
        id: should_build
        run: |
          TAG="${GITHUB_REF_NAME}"
          VARIANT="${{ matrix.tag }}"

          # If tag starts with variant name (e.g., "ha-alpine-1.0.0"), build only that variant
          if [[ "$TAG" == "$VARIANT-"* ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Building $VARIANT because tag starts with variant name: $TAG"
          # If tag has no variant prefix (e.g., "1.0.0"), build all variants
          elif [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Building all variants because tag has no prefix: $TAG"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Skipping $VARIANT because tag doesn't match: $TAG"
          fi

      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}-${{ steps.vars.outputs.VERSION_TAG }}
            ${{ matrix.latest && format('type=raw,value=latest') || '' }}
          labels: |
            org.opencontainers.image.title=VNC Browser (${{ matrix.tag }})
            org.opencontainers.image.version=${{ steps.vars.outputs.VERSION_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build only one architecture image for testing to being able to --load it
      - name: Build ${{ matrix.variant }} image for test
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.TEST_PLATFORM }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup
        if: steps.should_build.outputs.build == 'true'
        run: |
          docker run -d --rm --name test-${{ matrix.tag }} \
            -p 5900:5900 -p 6080:6080 \
            -e VNC_PASSWORD=testpass \
            ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          echo "Waiting for container to start..."
          sleep 10
          docker ps
          curl -sSf http://localhost:6080 > /dev/null
          echo "Test passed for ${{ matrix.tag }}"

      # Build and push multi-arch images
      - name: Push multi-arch ${{ matrix.variant }} image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
